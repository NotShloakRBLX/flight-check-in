<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b16" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Flight Check In</title>

  <style>
    :root {
      --bg: #070b16;
      --panel: rgba(15, 22, 34, 0.84);
      --panel-strong: rgba(18, 27, 42, 0.96);
      --line: rgba(255, 255, 255, 0.12);
      --line-strong: rgba(255, 255, 255, 0.2);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.66);
      --soft: rgba(255, 255, 255, 0.42);
      --green: #22d87a;
      --green-2: #0fb665;
      --blue: #43a9ff;
      --blue-2: #1778ff;
      --red: #ff4b55;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100svh;
      background:
        radial-gradient(circle at top left, rgba(45, 89, 210, 0.24), transparent 34%),
        radial-gradient(circle at top right, rgba(0, 196, 142, 0.14), transparent 28%),
        linear-gradient(180deg, #070b16 0%, #06111b 100%);
      background-color: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .hidden {
      display: none !important;
    }

    .app {
  width: min(100%, 720px);
  min-height: 100svh;
  margin: 0 auto;
  padding: calc(10px + env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom));
}

    .screen {
      animation: screenIn 0.34s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.99);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes stepIn {
      from {
        opacity: 0;
        transform: translateX(22px) scale(0.985);
        filter: blur(3px);
      }

      to {
        opacity: 1;
        transform: translateX(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes stepOut {
      from {
        opacity: 1;
        transform: translateX(0);
      }

      to {
        opacity: 0;
        transform: translateX(-18px);
      }
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .top {
      margin-bottom: 18px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 5px 0 0;
      font-size: clamp(34px, 10vw, 56px);
      line-height: 0.96;
      letter-spacing: -0.055em;
    }

    .progress-wrap {
      margin: 18px 0 18px;
    }

    .progress {
  width: min(100%, 270px);
  margin: 0 auto 13px;
  position: relative;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

    .progress-line,
.progress-fill {
  position: absolute;
  left: 11px;
  right: 11px;
  top: 50%;
  height: 2.5px;
  border-radius: 999px;
  transform: translateY(-50%);
}

    .progress-line {
      background: rgba(255, 255, 255, 0.16);
    }

    .progress-fill {
      right: auto;
      width: var(--progress-width, 0%);
      background: linear-gradient(90deg, var(--green), #7df7b6);
      transition: width 0.34s cubic-bezier(.2,.8,.2,1);
    }

    .dot {
  width: 22px;
  height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: #111827;
      position: relative;
      z-index: 1;
      transition: background 0.24s ease, border-color 0.24s ease, transform 0.24s ease;
      cursor: pointer;
      padding: 0;
    }

    .dot.active {
      border-color: rgba(34, 216, 122, 0.8);
      background: var(--green);
      transform: scale(1.08);
      box-shadow: 0 0 0 6px rgba(34, 216, 122, 0.13);
    }

    .progress-underline {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    }

    .flight-hero {
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.035)),
        var(--panel);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 20px 52px rgba(0,0,0,0.28);
      backdrop-filter: blur(18px);
      padding: 16px;
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }

    .airline-logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    .route {
      font-size: clamp(30px, 9vw, 44px);
      font-weight: 950;
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .route span {
      color: var(--blue);
    }

    .hero-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .hero-code {
      margin-top: 10px;
      color: var(--blue);
      font-size: 23px;
      font-weight: 950;
      letter-spacing: 0.05em;
    }

    .step-panel {
      animation: stepIn 0.34s cubic-bezier(.2,.8,.2,1) both;
    }

    .step-panel.exiting {
      animation: stepOut 0.2s ease both;
    }

    .panel-title {
      margin: 0 0 18px;
      font-size: clamp(30px, 8.8vw, 44px);
      line-height: 1.02;
      font-weight: 950;
      letter-spacing: -0.055em;
    }

    .passenger-card,
    .advisory-card,
    .details-card,
    .arrival-card {
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.035)),
        var(--panel);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 46px rgba(0,0,0,0.24);
      backdrop-filter: blur(18px);
    }

    .passenger-card {
      width: 100%;
      min-height: 104px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      cursor: pointer;
      transition: border-color 0.22s ease, transform 0.18s ease, background 0.22s ease, box-shadow 0.22s ease;
    }

    .passenger-card:hover {
      border-color: rgba(67, 169, 255, 0.7);
      background:
        linear-gradient(180deg, rgba(67,169,255,0.12), rgba(255,255,255,0.04)),
        var(--panel);
    }

    .passenger-card:active {
      transform: scale(0.985);
    }

    .passenger-card.selected {
      border-color: rgba(67, 169, 255, 0.92);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.1),
        0 0 0 4px rgba(67, 169, 255, 0.16),
        0 18px 46px rgba(0,0,0,0.24);
    }

    .passenger-card > div:first-child {
  flex: 1;
  min-width: 0;
  text-align: left;
}
    
    .passenger-name {
      font-size: 24px;
      font-weight: 950;
      letter-spacing: -0.04em;
    }

    .passenger-seat {
  margin-top: 5px;
  color: var(--muted);
  font-size: 16px;
  font-weight: 800;
  text-align: left;
  max-width: 230px;
}

    .selected-pill {
      color: var(--blue);
      font-size: 13px;
      font-weight: 950;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .passenger-card.selected .selected-pill {
      opacity: 1;
    }

    .advisory-list {
      display: grid;
      gap: 12px;
    }

    .advisory-card {
      padding: 16px;
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 14px;
      align-items: start;
    }

    .advisory-icon {
      width: 42px;
      height: 42px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: rgba(67, 169, 255, 0.12);
      color: var(--blue);
      font-size: 14px;
      font-weight: 950;
    }

    .advisory-title {
      font-size: 17px;
      font-weight: 950;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .advisory-text {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.38;
    }

    .details-card {
      overflow: hidden;
    }

    .details-route-band {
      padding: 18px;
      background:
        radial-gradient(circle at top right, rgba(67, 169, 255, 0.18), transparent 40%),
        rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--line);
    }

    .details-route {
      font-size: clamp(33px, 10vw, 50px);
      font-weight: 950;
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .details-route span {
      color: var(--blue);
    }

    .details-subroute {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 800;
    }

    .timeline {
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .timeline-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
    }

    .timeline-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .timeline-airport {
      font-size: 23px;
      font-weight: 950;
      letter-spacing: -0.04em;
    }

    .timeline-city {
      color: var(--muted);
      font-size: 14px;
      font-weight: 750;
      margin-top: 3px;
    }

    .timeline-time {
      font-size: 31px;
      font-weight: 950;
      letter-spacing: -0.055em;
      white-space: nowrap;
    }

    .details-divider {
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0.12), rgba(255,255,255,0.32), rgba(255,255,255,0.12));
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--line);
      border-top: 1px solid var(--line);
    }

    .detail-stat {
      background: rgba(11, 16, 27, 0.72);
      padding: 14px 12px;
    }

    .detail-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .detail-value {
      font-size: 18px;
      font-weight: 950;
      letter-spacing: -0.03em;
      overflow-wrap: anywhere;
    }

        .boarding-status-card {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .boarding-status-box {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(11, 16, 27, 0.72);
      padding: 16px;
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 14px;
      align-items: center;
    }

    .boarding-status-box.seat-message {
      display: block;
      color: rgba(255, 255, 255, 0.78);
      font-size: 17px;
      font-weight: 760;
      line-height: 1.35;
    }

    .boarding-status-box.seat-message strong {
      color: white;
      font-weight: 950;
    }

    .checkin-premium-badge {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd43b, #ff9f1c);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 950;
      box-shadow: 0 14px 34px rgba(255, 180, 40, 0.26);
    }

    .checkin-premium-badge.premium-economy {
      background: linear-gradient(135deg, #f4f7fb, #aeb7c4, #747d8c);
      color: #111827;
      box-shadow: 0 14px 34px rgba(190, 198, 210, 0.22);
    }

    .boarding-status-title {
      color: white;
      font-size: 19px;
      font-weight: 950;
      letter-spacing: -0.03em;
      line-height: 1.12;
    }
    
    .arrival-card {
      padding: 16px;
    }

    .passport-notice {
      border: 1px solid rgba(67, 169, 255, 0.42);
      background:
        linear-gradient(180deg, rgba(67, 169, 255, 0.18), rgba(67, 169, 255, 0.08)),
        rgba(12, 26, 45, 0.72);
      border-radius: 22px;
      padding: 16px;
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 14px;
      align-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 42px rgba(0,0,0,0.22);
    }

    .passport-notice img {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    .notice-title {
      font-size: 20px;
      font-weight: 950;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }

    .notice-text {
      color: rgba(255, 255, 255, 0.74);
      font-size: 14px;
      font-weight: 750;
      line-height: 1.35;
    }

    .arrival-meta {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .arrival-meta .detail-stat {
  border-radius: 18px;
  border: 1px solid var(--line);
  overflow: hidden;
}

    .button-row {
      margin-top: 20px;
    }

    .continue-button {
      width: 100%;
      min-height: 58px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, #2ce98c, #12b967);
      color: #04140b;
      font-size: 18px;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 16px 34px rgba(18, 185, 103, 0.25);
      transition: transform 0.16s ease, opacity 0.16s ease;
    }

    .continue-button:active {
      transform: scale(0.975);
    }

    .continue-button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      box-shadow: none;
    }

    .unavailable {
      min-height: calc(100svh - 70px);
      display: grid;
      place-items: center;
    }

    .unavailable-card {
      width: min(100%, 430px);
      border: 1px solid var(--line);
      border-radius: 26px;
      background:
        radial-gradient(circle at top, rgba(255, 75, 85, 0.16), transparent 45%),
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.035)),
        var(--panel);
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    .unavailable-icon {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      background: rgba(255,255,255,0.08);
      color: var(--red);
      font-size: 18px;
      font-weight: 950;
    }

    .unavailable-title {
      font-size: 28px;
      font-weight: 950;
      letter-spacing: -0.045em;
      margin-bottom: 8px;
    }

    .unavailable-text {
      color: var(--muted);
      font-size: 15px;
      font-weight: 750;
      line-height: 1.4;
    }

    .modal-cover {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: grid;
      place-items: center;
      padding: 24px;
      z-index: 20;
      backdrop-filter: blur(14px);
    }

    .modal {
      width: min(100%, 360px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04)),
        var(--panel-strong);
      padding: 30px;
      text-align: center;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.48);
      animation: modalIn 0.32s cubic-bezier(.2,.8,.2,1) both;
    }

    .spinner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.14);
      border-top-color: var(--green);
      margin: 0 auto 18px;
      animation: spin 1s linear infinite;
    }

    .modal.success .spinner {
      animation: none;
      border: none;
      background: var(--green);
      color: #04140b;
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 950;
    }

    .modal.success .spinner::before {
      content: "OK";
      font-size: 17px;
    }

    .modal-title {
      font-size: 25px;
      font-weight: 950;
      letter-spacing: -0.04em;
      margin-bottom: 6px;
    }

    .modal-text {
      color: var(--muted);
      font-size: 15px;
      font-weight: 750;
    }

    .confirmation-card {
      overflow: hidden;
      margin-bottom: 18px;
    }

    .confirmation-priority-card {
  overflow: hidden;
  margin-bottom: 18px;
}

.confirmation-priority-top {
  padding: 18px;
  background:
    radial-gradient(circle at top right, rgba(67, 169, 255, 0.18), transparent 40%),
    rgba(255, 255, 255, 0.04);
  border-bottom: 1px solid var(--line);
  color: #ff4b55;
  font-size: 18px;
  font-weight: 950;
  letter-spacing: 0.14em;
  text-align: center;
}

.confirmation-priority-bottom {
  background: rgba(11, 16, 27, 0.76);
  padding: 18px;
  color: white;
  font-size: 18px;
  font-weight: 850;
  text-align: center;
}

    .confirmation-top {
      padding: 18px;
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 14px;
      align-items: center;
      background:
        radial-gradient(circle at top right, rgba(67, 169, 255, 0.18), transparent 40%),
        rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--line);
    }

    .confirmation-top img {
      width: 50px;
      height: 50px;
      object-fit: contain;
    }

    .confirmation-route {
      font-size: clamp(24px, 7vw, 34px);
      font-weight: 950;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .confirmation-sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .confirmation-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
    }

    .confirmation-stat {
      background: rgba(11, 16, 27, 0.76);
      padding: 18px;
    }

    .boarding-pass-preview {
      position: relative;
      min-height: 216px;
      border-radius: 26px;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 6%, rgba(255,255,255,0.34), transparent 20%),
        radial-gradient(circle at 92% 14%, rgba(255,255,255,0.24), transparent 28%),
        linear-gradient(135deg, #f8fbff 0%, #e8f4ff 30%, #189cff 58%, #006ee6 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.45),
        0 22px 54px rgba(0, 110, 230, 0.18);
      margin: 18px 0;
    }

    .boarding-pass-preview.first-business {
      background:
        radial-gradient(circle at 12% 6%, rgba(255,225,128,0.28), transparent 22%),
        linear-gradient(135deg, #050505 0%, #17120a 44%, #6b4b12 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,225,128,0.2),
        0 22px 54px rgba(224, 174, 55, 0.16);
    }

    .boarding-pass-preview.premium-economy {
      background:
        radial-gradient(circle at 12% 6%, rgba(255,255,255,0.38), transparent 22%),
        linear-gradient(135deg, #eef3f9 0%, #aeb9c7 38%, #173054 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.34),
        0 22px 54px rgba(119, 141, 170, 0.16);
    }

    .pass-label {
      color: rgba(255,255,255,0.78);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.18em;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .pass-code {
      color: white;
      font-size: clamp(42px, 13vw, 68px);
      font-weight: 950;
      letter-spacing: 0.08em;
      text-align: center;
      line-height: 1;
      padding: 14px 0;
      border-top: 1px solid rgba(255,255,255,0.48);
      border-bottom: 1px solid rgba(255,255,255,0.48);
      text-shadow: 0 2px 16px rgba(0,0,0,0.16);
    }

    .pass-group {
      margin-top: 12px;
      color: white;
      font-size: 18px;
      font-weight: 900;
      text-align: center;
    }

    .pass-bottom {
      margin-top: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: end;
      gap: 16px;
    }

    .pass-small-label {
      color: rgba(255,255,255,0.82);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .pass-seat {
      color: white;
      font-size: 38px;
      font-weight: 950;
      line-height: 1;
    }

    .pass-cabin {
      color: white;
      font-size: 22px;
      font-weight: 850;
      text-align: right;
    }

    .entry-reminder {
      margin: 4px 0 18px;
    }

    @media (max-width: 520px) {
      .app {
  padding: calc(8px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
}

      .flight-hero {

        const snapshot=await transaction.get(doc(db,"trips",tripId));
        if (!snapshot.exists() || snapshot.data().status !== "booked") throw new Error("This trip is no longer available.");
        const legs=snapshot.data().legs.filter(leg=>leg.direction === direction);

        if (ids.length !== expectedIds.length || ids.some((id,index)=>id !== expectedIds[index])) throw new Error("Your itinerary changed. Reload check in.");

      const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let hash = 0;

            <div>
              <div class="advisory-title">Liquids and gels</div>
              <div class="advisory-text">Carry-on liquids should follow standard security limits unless they are medically required or packed in checked baggage.</div>
            </div>
          </section>

          <section class="advisory-card">
            <div class="advisory-icon">ID</div>
            <div>
              <div class="advisory-title">Travel documents</div>
              <div class="advisory-text">Names, identification, and travel documents must match the passenger traveling on this reservation.</div>
            </div>
          </section>

          <section class="advisory-card">
            <div class="advisory-icon">SEC</div>
            <div>
              <div class="advisory-title">Security screening</div>
              <div class="advisory-text">All passengers and baggage remain subject to screening before departure.</div>
            </div>
          </section>
        </div>

        <div class="button-row">
          <button class="continue-button" id="continueButton" type="button">Continue</button>
        </div>
      `;

      document.getElementById("continueButton").addEventListener("click", () => {
        transitionToStep(2);
      });
    }

    function renderFlightDetailsStep(flight=activeFlight,embedded=false) {
      const departure = getDepartureDateTime(flight);
      const arrival = getArrivalDateTime(flight);
            const steps = getSteps();
      const nextStep = steps.indexOf("Flight") + 1;
      const nextStepName = steps[nextStep];
      const hasNextStep = nextStep < steps.length;

      const html = `
        ${embedded ? '' : '<h2 class="panel-title">Flight details</h2>'}

        <section class="details-card">
          <div class="details-route-band">
            <div class="details-route">
              <span>${escapeHTML(flight.departureAirport || "DEP")}</span>
              &rarr;
              <span>${escapeHTML(flight.arrivalAirport || "ARR")}</span>
            </div>
            <div class="details-subroute">
              ${escapeHTML(flight.cityDeparture || "Departure")} to ${escapeHTML(flight.cityArrival || "Arrival")}
            </div>
          </div>

          <div class="timeline">
            <div class="timeline-row">
              <div>
                <div class="timeline-label">Departure</div>
                <div class="timeline-airport">${escapeHTML(flight.departureAirport || "DEP")}</div>
                <div class="timeline-city">${escapeHTML(flight.cityDeparture || "Departure")}</div>
              </div>
              <div class="timeline-time">${escapeHTML(formatTime(departure))}</div>
            </div>

            <div class="details-divider"></div>

            <div class="timeline-row">
              <div>
                <div class="timeline-label">Arrival</div>
                <div class="timeline-airport">${escapeHTML(flight.arrivalAirport || "ARR")}</div>
                <div class="timeline-city">${escapeHTML(flight.cityArrival || "Arrival")}</div>
              </div>
              <div class="timeline-time">${escapeHTML(formatTime(arrival))}</div>
            </div>
          </div>

          <div class="details-grid">
            <div class="detail-stat">
              <div class="detail-label">Flight</div>
              <div class="detail-value">${escapeHTML(flight.airline || "AA")} ${escapeHTML(flight.flightNumber || "0000")}</div>
            </div>

            <div class="detail-stat">
              <div class="detail-label">Seat</div>
              <div class="detail-value">${escapeHTML(flight.assignedSeat || "--")}</div>
            </div>

            <div class="detail-stat">
              <div class="detail-label">Code</div>
              <div class="detail-value">${escapeHTML(getReservationCode(flight))}</div>
            </div>
          </div>
        </section>

        <div class="button-row">
                    <button class="continue-button" id="continueButton" type="button">${hasNextStep ? "Continue" : "Check in"}</button>
        </div>
      `;
      if (embedded) return checkInCardMarkup(html);
      stepPanel.innerHTML=activeTrip ? `<h2 class="panel-title">Flight details</h2>${sectionFlights.map(item=>tripAccordion(`details-${item.id}`,tripFlightSummary(item),renderFlightDetailsStep(item,true))).join('')}<div class="button-row"><button class="continue-button" id="continueButton" type="button">${hasNextStep ? 'Continue' : 'Check in'}</button></div>` : html;

            document.getElementById("continueButton").addEventListener("click", () => {
        if (hasNextStep) {
          transitionToStep(nextStep);
          return;
        }

        completeCheckIn();
      });
    }

    function renderBoardingStatusStep(flight=activeFlight,embedded=false) {
      const steps = getSteps();
      const nextStep = steps.indexOf("Boarding") + 1;
      const hasArrivalStep = steps[nextStep] === "Arrival";
      const isPremiumEconomy = flight.premiumEconomySeat === true;
      const badgeClass = isPremiumEconomy ? "premium-economy" : "";
      const seat = flight.assignedSeat || "--";

      const html = `
        <h2 class="panel-title">Boarding status</h2>

        <section class="details-card boarding-status-card">
          <div class="boarding-status-box">
            <div class="checkin-premium-badge ${badgeClass}">P</div>
            <div class="boarding-status-title">You have priority boarding</div>
          </div>

          <div class="boarding-status-box seat-message">
            You are in seat <strong>${escapeHTML(seat)}</strong>. You have priority access for this flight.
          </div>
        </section>

        <div class="button-row">
          <button class="continue-button" id="continueButton" type="button">${hasArrivalStep ? "Continue" : "Check in"}</button>
        </div>
      `;
      if (embedded) return checkInCardMarkup(html);
      stepPanel.innerHTML=activeTrip ? `<h2 class="panel-title">Boarding status</h2>${sectionFlights.filter(hasPriorityBoardingStatus).map(item=>tripFlightLabel(item)+renderBoardingStatusStep(item,true)).join('')}<div class="button-row"><button class="continue-button" id="continueButton" type="button">${hasArrivalStep ? 'Continue' : 'Check in'}</button></div>` : html;

      document.getElementById("continueButton").addEventListener("click", () => {
        if (hasArrivalStep) {
          transitionToStep(nextStep);
          return;
        }

        completeCheckIn();
      });
    }
    
    function renderArrivalStep(flight=activeFlight,embedded=false) {
  const html = `
    <h2 class="panel-title">${escapeHTML(getInternationalStepTitle(flight))}</h2>

    <section class="arrival-card">
      <div class="passport-notice">
        <img src="./cbp.png" alt="CBP logo" onerror="this.style.display='none';" />
        <div>
          <div class="notice-title">${escapeHTML(getInternationalNoticeTitle(flight))}</div>
          <div class="notice-text">${escapeHTML(getInternationalNoticeText(flight))}</div>
        </div>
      </div>

      <div class="arrival-meta">
        <div class="detail-stat">
          <div class="detail-label">${escapeHTML(getInternationalAirportLabel(flight))}</div>
          <div class="detail-value">${escapeHTML(getInternationalAirportValue(flight))}</div>
        </div>

        <div class="detail-stat">
          <div class="detail-label">Traveler</div>
          <div class="detail-value">Shloak Patel</div>
        </div>
      </div>
    </section>

    <div class="button-row">
      <button class="continue-button" id="continueButton" type="button">Check in</button>
    </div>
  `;
  if (embedded) return checkInCardMarkup(html);
  stepPanel.innerHTML=activeTrip ? `<h2 class="panel-title">Travel requirements</h2>${sectionFlights.filter(hasInternationalUSCheckInRequirement).map(item=>tripFlightLabel(item)+renderArrivalStep(item,true)).join('')}<div class="button-row"><button class="continue-button" id="continueButton" type="button">Check in</button></div>` : html;

  document.getElementById("continueButton").addEventListener("click", completeCheckIn);
}

    function renderBoardingPassPreview(flight=activeFlight) {
      const passClass = getBoardingPassClass(flight);

      return `
        <section class="boarding-pass-preview ${passClass}">
          <div class="pass-label">Boarding code</div>
          <div class="pass-code">${escapeHTML(getBoardingCode(flight))}</div>
          <div class="pass-group">${escapeHTML(getBoardingGroupText(flight))}</div>

          <div class="pass-bottom">
            <div>
              <div class="pass-small-label">Seat</div>
              <div class="pass-seat">${escapeHTML(flight.assignedSeat || "--")}</div>
            </div>

            <div class="pass-cabin">${escapeHTML(flight.seatCabin || "Economy")}</div>
          </div>
        </section>
      `;
    }

    function renderPriorityBoardingConfirmation(flight=activeFlight) {
  if (!hasPriorityBoardingStatus(flight)) return "";

  return `
    <section class="details-card confirmation-priority-card">
      <div class="confirmation-priority-top">PRIORITY BOARDING</div>
      <div class="confirmation-priority-bottom">
        You are boarding in ${escapeHTML(getBoardingGroupText(flight))}
      </div>
    </section>
  `;
}
    
    function renderEntryReminder(flight=activeFlight) {
      if (!hasInternationalUSCheckInRequirement(flight)) return "";

      return `
        <section class="passport-notice entry-reminder">
          <img src="./cbp.png" alt="CBP logo" onerror="this.style.display='none';" />
          <div>
            <div class="notice-title">US Customs and Border Protection</div>
            <div class="notice-text">${escapeHTML(getEntryReminderText(flight))}</div>
          </div>
        </section>
      `;
    }

    function renderConfirmationPage() {
      confirmationVisible = true;
      checkInCompleting = false;
      progressWrap.classList.add("hidden");
      renderHero();

      stepPanel.classList.remove("exiting");
      stepPanel.style.animation = "none";
      void stepPanel.offsetWidth;
      stepPanel.style.animation = "";

      stepPanel.innerHTML = `
        <h2 class="panel-title">Check in confirmation</h2>

        <section class="details-card confirmation-card">
          <div class="confirmation-top">
            <img
              src="${getAirlineLogoPath(activeFlight.airline)}"
              alt="${escapeHTML(activeFlight.airline || "Airline")} logo"
              onerror="this.style.display='none';"
            />
            <div>
              <div class="confirmation-route">
                ${escapeHTML(activeFlight.cityDeparture || activeFlight.departureAirport || "Departure")}
                to
                ${escapeHTML(activeFlight.cityArrival || activeFlight.arrivalAirport || "Arrival")}
              </div>
              <div class="confirmation-sub">
                ${escapeHTML(activeFlight.airline || "AA")} ${escapeHTML(activeFlight.flightNumber || "0000")} &bull; ${escapeHTML(formatDate(activeFlight.flightDateRaw))}
              </div>
            </div>
          </div>

          <div class="confirmation-stats">
            <div class="confirmation-stat">
              <div class="detail-label">Seat</div>
              <div class="detail-value">${escapeHTML(activeFlight.assignedSeat || "--")}</div>
            </div>

            <div class="confirmation-stat">
              <div class="detail-label">Group</div>
              <div class="detail-value">${escapeHTML(getBoardingGroupText(activeFlight).replace("Group ", ""))}</div>
            </div>
          </div>
        </section>

        ${renderPriorityBoardingConfirmation()}
${renderBoardingPassPreview()}
${renderEntryReminder()}

        <div class="button-row">
          <button class="continue-button" id="continueButton" type="button">Continue</button>
        </div>
      `;

      if (activeTrip) stepPanel.innerHTML=`<h2 class="panel-title">Check in confirmation</h2>${sectionFlights.map(flight=>tripAccordion(`pass-${flight.id}`,tripFlightSummary(flight),renderPriorityBoardingConfirmation(flight)+renderBoardingPassPreview(flight)+renderEntryReminder(flight))).join('')}<div class="button-row"><button class="continue-button" id="continueButton" type="button">Continue</button></div>`;
      document.getElementById("continueButton").addEventListener("click", () => {
        if (returnUrl) {
          window.location.href = returnUrl;
          return;
        }

        showUnavailable("Check in complete", "Your boarding pass is now available on the main flight site.");
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderStep() {
      renderHero();
      progressWrap.classList.remove("hidden");
      renderProgress();

      stepPanel.classList.remove("exiting");

            const currentStep = getSteps()[activeStep];

      if (currentStep === "Passenger") renderPassengerStep();
      if (currentStep === "Advisories") renderAdvisoriesStep();
      if (currentStep === "Flight") renderFlightDetailsStep();
      if (currentStep === "Boarding") renderBoardingStatusStep();
      if (currentStep === "Arrival") renderArrivalStep();
    }

    function transitionToStep(nextStep) {
      stepPanel.classList.add("exiting");

      setTimeout(() => {
        activeStep = nextStep;
        stepPanel.classList.remove("exiting");
        stepPanel.style.animation = "none";
        void stepPanel.offsetWidth;
        stepPanel.style.animation = "";
        renderStep();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }, 190);
    }

    function showLoadingModal() {
      modalBox.classList.remove("success");
      modalTitle.textContent = "Checking you in";
      modalText.textContent = activeTrip ? "Issuing boarding passes..." : "Issuing boarding pass...";
      loadingModal.classList.remove("hidden");
    }

    async function completeCheckIn() {
      if (!activeFlight || !activeFlight.id || checkInCompleting) return;

      checkInCompleting = true;
      showLoadingModal();

      try {
        await new Promise((resolve) => setTimeout(resolve, 5000));

        if (activeTrip) {
          await checkInTripSection(activeTrip.id,sectionDirection,sectionFlights.map(flight=>flight.id));
          sectionFlights=sectionFlights.map(flight=>({...flight,checkedIn:true,checkInOpened:true}));
        } else await updateDoc(doc(db, "flights", activeFlight.id), {
          checkedIn: true,
          checkedInAt: serverTimestamp(),
          checkInOpened: true,
          checkInOpenedAt: activeFlight.checkInOpenedAt || serverTimestamp()
        });

        activeFlight = {
          ...activeFlight,
          checkedIn: true,
          checkInOpened: true
        };

        setTimeout(() => {
          loadingModal.classList.add("hidden");
          renderConfirmationPage();
        }, 450);
      } catch (error) {
        checkInCompleting = false;
        console.error("Check in failed:", error);
        modalBox.classList.remove("success");
        modalTitle.textContent = "Check in failed";
        modalText.textContent = "Reload the page and try again.";
      }
    }

    function startFlight(flight) {
      activeFlight = flight;
      activeStep = 0;
      passengerSelected = false;

      showCheckIn();
      renderStep();
    }

    function startCheckInSite() {
  onSnapshot(collection(db,"trips"),snapshot=>{
    checkInTripsCache=new Map(snapshot.docs.map(item=>[item.id,{id:item.id,...item.data()}]));
    checkInTripsLoaded=true;refreshTripCheckIn();
  },error=>{console.error("Unable to load trips",error);showUnavailable("Unable to load check in","Reload the page and try again.");});
  if (!flightId && !requestedTripId) {
    showUnavailable("This site is locked", "Open check in from a specific flight on the main site.");
  }

  onSnapshot(collection(db, "flights"), (snapshot) => {
      checkInFlightsCache=new Map(snapshot.docs.map(item=>[item.id,{id:item.id,...item.data()}]));
      checkInFlightsLoaded=true;
      if (requestedTripId || checkInFlightsCache.get(flightId)?.tripId || activeTrip) { refreshTripCheckIn();return; }
      if (!flightId) return;

      const flightDoc = snapshot.docs.find((item) => item.id === flightId);

      if (!flightDoc) {
        showUnavailable("Flight not found", "This check-in session could not find the selected flight.");
        return;
      }

      const flight = {
        id: flightDoc.id,
        ...flightDoc.data()
      };

      if (flight.checkedIn === true) {
        if (checkInCompleting || confirmationVisible) {
          activeFlight = {
            ...activeFlight,
            ...flight
          };

          if (confirmationVisible) {
            renderHero();
          }

          return;
        }

        showUnavailable("Already checked in", "Your boarding pass is already available on the main flight site.");
        return;
      }

      if (!isEligibleForCheckIn(flight)) {
        showUnavailable("Check in unavailable", "Check in opens 24 hours before scheduled departure.");
        return;
      }

      if (!activeFlight) {
        startFlight(flight);
        return;
      }

      activeFlight = flight;
      renderHero();
      renderProgress();
        }, (error) => {
      console.error("Error loading flight:", error);
      showUnavailable("Unable to load check in", "Reload the page and try again.");
    });
}

function refreshTripCheckIn() {
  if (!checkInFlightsLoaded || !checkInTripsLoaded) return;
  const selected=checkInFlightsCache.get(flightId);
  const id=requestedTripId || selected?.tripId || activeTrip?.id;
  if (!id) return;
  const trip=checkInTripsCache.get(id);
  if (!trip || trip.status !== "booked") { showUnavailable("Trip unavailable","This trip is no longer available for check in.");return; }
  const direction=requestedTripId ? sectionDirection : selected?.tripDirection || sectionDirection;
  const legs=trip.legs.filter(leg=>leg.direction === direction);
  const flights=checkInSectionFlights(trip,direction,checkInFlightsCache);
  if (!legs.length || flights.length !== legs.length) { showUnavailable("Section unavailable","A flight in this section is no longer available.");return; }
  const starting=!activeTrip;
  activeTrip=trip;sectionDirection=direction;sectionFlights=flights;activeFlight=flights[0];
  if (checkInCompleting) return;
  if (flights.every(flight=>flight.checkedIn === true)) {showCheckIn();if (!confirmationVisible)renderConfirmationPage();else renderHero();return;}
  if (!tripSectionOpen(flights)) {showUnavailable("Check in unavailable","Check in opens 24 hours before the first flight in this section departs.");return;}
  showCheckIn();
  if (starting || unavailableScreen.classList.contains("hidden") && !stepPanel.innerHTML.trim()) {activeStep=0;passengerSelected=false;renderStep();}
  else {renderHero();renderProgress();}
}

setInterval(()=>{if (activeTrip && !confirmationVisible && !checkInCompleting && !unavailableScreen.classList.contains("hidden"))refreshTripCheckIn();},1000);

requireOwnerAuth(startCheckInSite);
  </script>
</body>
</html>
